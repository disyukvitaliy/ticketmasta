services:
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: ["flask", "run", "--host=0.0.0.0", "--debug"]
    stop_signal: SIGINT
    volumes:
      - ./core:/app
    environment:
      CORE_ENV: development
      CORE_DB_DSN: postgresql+psycopg://core:core@core_db:5432/core
      CORE_READ_DB_DSN: postgresql+psycopg://core:core@core_db_replica:5432/core
      CORE_REDIS_URL: redis://redis:6379/1
    depends_on:
      - core_db
      - core_db_replica
      - redis
  core_worker:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: ["dramatiq", "worker", "--processes", "1", "--threads", "2", "--skip-logging"]
    volumes:
      - ./core:/app
    environment:
      CORE_DB_DSN: postgresql+psycopg://core:core@core_db:5432/core
      CORE_READ_DB_DSN: postgresql+psycopg://core:core@core_db_replica:5432/core
      CORE_REDIS_URL: redis://redis:6379/1
      CORE_SMTP_HOST: mailpit
      CORE_SMTP_PORT: 1025
      CORE_EMAIL_FROM: tickets@ticketmasta.com
    depends_on:
      - core_db
      - core_db_replica
      - redis
      - mailpit
  core_scheduler:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: ["python", "scheduler.py"]
    volumes:
      - ./core:/app
    environment:
      CORE_DB_DSN: postgresql+psycopg://core:core@core_db:5432/core
      CORE_REDIS_URL: redis://redis:6379/1
    depends_on:
      - redis
  core_consumer:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: ["faststream", "run", "profiles.consumer:app", "--workers", "1"]
    volumes:
      - ./core:/app
    environment:
      CORE_KAFKA_ADDR: kafka:19092
      CORE_USER_EVENT_CONCURRENCY: 3
      CORE_DB_DSN: postgresql+psycopg://core:core@core_db:5432/core
    depends_on:
      - kafka
      - core_db
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    command: go run .
    volumes:
      - ./auth:/app
    depends_on:
      - auth_db
      - redis
      - kafka
    environment:
      AUTH_JWT_SECRET: your-very-secret-key
      AUTH_REDIS_ADDR: redis:6379
      AUTH_KAFKA_ADDR: kafka:19092
      GOOSE_DRIVER: postgres
      GOOSE_MIGRATION_DIR: ./migrations
      LOG_LEVEL: debug
      GOOSE_DBSTRING: postgres://auth:auth@auth_db:5432/auth?sslmode=disable
      AUTH_DB_DSN: postgres://auth:auth@auth_db:5432/auth?sslmode=disable
  auth_worker:
    build:
      context: ./auth
      dockerfile: Dockerfile
    command: go run ./cmd/worker
    volumes:
      - ./auth:/app
    depends_on:
      - redis
    environment:
      AUTH_REDIS_ADDR: redis:6379
      AUTH_SMTP_HOST: mailpit
      AUTH_SMTP_PORT: 1025
      LOG_LEVEL: debug
  web:
    image: nginx:latest
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: 1
    volumes:
      - ./web:/usr/share/nginx/html
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
  envoy:
    image: envoyproxy/envoy:v1.36.2
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "warn"]
    ports:
      - '80:8080'
      - '9902:9902'
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - core
      - auth
  auth_db:
    image: postgres:18
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql
  core_db:
    image: postgres:18
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: core
    ports:
      - "5433:5432"
    volumes:
      - core_db_data:/var/lib/postgresql
      - ./core_db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./core_db/init-replication.sql:/docker-entrypoint-initdb.d/01-replication.sql:ro
  core_db_replica:
    image: postgres:18
    environment:
      PGPASSWORD: replicator
      PGDATA: /var/lib/postgresql/18/docker
    depends_on:
      - core_db
    volumes:
      - core_db_replica_data:/var/lib/postgresql
      - ./core_db/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    entrypoint: ["sh", "/usr/local/bin/replica-entrypoint.sh"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
  kafka:
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
  kafka_ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

volumes:
  auth_db_data:
  core_db_data:
  core_db_replica_data:
  kafka_data:
