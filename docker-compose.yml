services:
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: ["flask", "run", "--host=0.0.0.0", "--debug"]
    stop_signal: SIGINT
    volumes:
      - ./core:/app
    environment:
      FLASK_ENV: development
      CORE_DB_DSN: postgresql+psycopg://core:core@core_db:5432/core
    depends_on:
      - core_db
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    command: go run .
    volumes:
      - ./auth:/app
    depends_on:
      - auth_db
      - redis
    environment:
      AUTH_JWT_SECRET: your-very-secret-key
      AUTH_REDIS_ADDR: redis:6379
      GOOSE_DRIVER: postgres
      GOOSE_MIGRATION_DIR: ./migrations
      LOG_LEVEL: debug
      GOOSE_DBSTRING: postgres://auth:auth@auth_db:5432/auth?sslmode=disable
      AUTH_DB_DSN: postgres://auth:auth@auth_db:5432/auth?sslmode=disable
  auth_worker:
    build:
      context: ./auth
      dockerfile: Dockerfile
    command: go run ./cmd/worker
    volumes:
      - ./auth:/app
    depends_on:
      - redis
    environment:
      AUTH_REDIS_ADDR: redis:6379
      AUTH_SMTP_HOST: mailpit
      AUTH_SMTP_PORT: 1025
      LOG_LEVEL: debug
  web:
    image: nginx:latest
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: 1
    volumes:
      - ./web:/usr/share/nginx/html
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
  envoy:
    image: envoyproxy/envoy:v1.36.2
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "warn"]
    ports:
      - '80:8080'
      - '9902:9902'
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - core
      - auth
  auth_db:
    image: postgres:18
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql
  core_db:
    image: postgres:18
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: core
    ports:
      - "5433:5432"
    volumes:
      - core_db_data:/var/lib/postgresql
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

volumes:
  auth_db_data:
  core_db_data:
