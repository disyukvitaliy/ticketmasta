<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketmasta</title>
    <script defer src="/main.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="registerPage()">
    <main>
    <h1>Register</h1>
    <form @submit.prevent="submit">
        <label for="reg-email">Email</label><br>
        <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email" x-model="email" required>
        <br>
        <label for="reg-password">Password</label><br>
        <input id="reg-password" type="password" autocomplete="new-password" x-model="password" required>
        <br>
        <label for="reg-password-confirm">Confirm Password</label><br>
        <input id="reg-password-confirm" type="password" autocomplete="new-password" x-model="confirm" required>
        <br>
        <label for="reg-terms">
            <input id="reg-terms" type="checkbox" x-model="terms" required> I accept the terms
        </label>
        <br>
        <button type="submit">Register</button>
    </form>
    <p x-show="error" x-text="error"></p>
    <p>
        <a href="/login">Already have an account? Login</a>
    </p>
    </main>
</body>
</html>
