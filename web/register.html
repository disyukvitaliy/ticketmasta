<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketmasta</title>
    <script src="/main.js"></script>
</head>
<body>
    <h1>Register</h1>
    <form id="register-form">
        <label for="reg-email">Email</label><br>
        <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email" required />
        <br>
        <label for="reg-password">Password</label><br>
        <input id="reg-password" type="password" autocomplete="new-password" required />
        <br>
        <label for="reg-password-confirm">Confirm Password</label><br>
        <input id="reg-password-confirm" type="password" autocomplete="new-password" required />
        <br>
        <label for="reg-terms">
            <input id="reg-terms" type="checkbox" required /> I accept the terms
        </label>
        <br>
        <button type="submit">Register</button>
    </form>
    <p>
        <a href="/login.html">Already have an account? Login</a>
    </p>
</body>
</html>
