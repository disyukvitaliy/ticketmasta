<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venues | Ticketmasta</title>
    <script defer src="/main.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="venuesPage()" x-init="load()">
    <main>
    <h1>Venues</h1>
    <p x-show="status" x-text="status"></p>
    <ul>
        <template x-for="venue in venues" :key="venue.id">
            <li><a :href="`/venues/${venue.id}`" x-text="venue.name"></a></li>
        </template>
    </ul>
    <nav aria-label="Venues pagination">
        <button type="button" @click="previous()" :disabled="page === 1">Back</button>
        <button type="button" @click="next()">Forward</button>
    </nav>
    <p>
        <a href="/">Back</a>
    </p>
    </main>
</body>
</html>
