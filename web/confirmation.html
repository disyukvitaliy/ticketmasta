<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm your email | Ticketmasta</title>
    <script defer src="/main.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="confirmPage()" x-init="confirm()">
    <main>
    <h1>Confirm email</h1>
    <p x-text="status"></p>

        <a href="/login">Login</a>
    </p>
    <p>
        <a href="/">Back</a>
    </p>
    </main>
</body>
</html>
