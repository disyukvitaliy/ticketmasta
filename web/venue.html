<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue | Ticketmasta</title>
    <script defer src="/main.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="venuePage()" x-init="init()">
    <main>
    <h1 x-text="venue ? venue.name : 'Venue'"></h1>
    <h2>Events</h2>
    <p x-show="status" x-text="status"></p>
    <ul>
        <template x-for="event in items" :key="event.id">
            <li x-text="itemLabel(event)"></li>
        </template>
    </ul>
    <nav aria-label="Venue events pagination" x-show="venue">
        <button type="button" @click="previous()" :disabled="page === 1">Back</button>
        <button type="button" @click="next()">Forward</button>
    </nav>
    <p>
        <a href="/venues">Back to venues</a>
    </p>
    </main>
</body>
</html>
