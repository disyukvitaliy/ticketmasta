server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /login { rewrite ^ /login.html last; }
    location = /register { rewrite ^ /register.html last; }
    location = /confirm { rewrite ^ /confirm.html last; }
    location = /profile { rewrite ^ /profile.html last; }
    location = /events { rewrite ^ /events.html last; }
    location ~ ^/events/[0-9]+$ { rewrite ^ /event.html last; }
    location = /venues { rewrite ^ /venues.html last; }
    location ~ ^/venues/[0-9]+$ { rewrite ^ /venue.html last; }

    location / { try_files $uri $uri/ =404; }
}
